name: Daily OHLC Update

# Scheduled — keeps the 5-year backfilled checkpoint data current through
# today's EOD close, and regenerates every JSON the Dashboard/Strangle
# Screen/IVP Screener pages read from it, with no manual trigger needed.
#
# Cron is UTC. Four runs per weekday, ~6h apart, IST equivalents:
#
#   - 02:30 UTC (08:00 IST) — before NSE opens (09:15 IST)
#   - 05:30 UTC (11:00 IST) — mid-morning session
#   - 10:30 UTC (16:00 IST) — just after NSE closes (15:30 IST)
#   - 14:30 UTC (20:00 IST) — evening, well clear of close
#
# Safe to run at ANY of these regardless of market state, including
# mid-session: scripts/backfill.py's drop_intraday_today_row() strips any
# row dated today from a fresh fetch whenever NSE is still open, so a run
# landing during trading hours can never store a live/partial price as if
# it were a settled close — it just finds nothing new for today and
# regenerates Supertrend/screens from whatever's already on disk, same
# outcome as a deliberate no-op. This guard is also why four runs/day is
# strictly safer than two, not just more frequent: it exists specifically
# because GitHub Actions' schedule trigger has been observed to fire
# 5-5.5h late, consistently (checked via the Actions API) — with four
# spread-out attempts instead of two, any single one landing late still
# leaves another nearby to pick up the real close sooner after it posts,
# without depending on GitHub honoring the cron time.
#
# Mon-Fri only (NSE doesn't trade weekends — a weekend run would just
# find zero new rows for every symbol and do nothing productive).
#
# See scripts/update_ohlc.py's own docstring for why this is NOT a full
# 5yr refetch of every symbol daily (far too slow/wasteful) — it's an
# incremental tail-append for most symbols, with a weekday-rotated full
# refresh of 1/5 of the universe to self-heal split/dividend adjustment
# drift that an incremental append can never retroactively fix.

on:
  schedule:
    - cron: "30 2 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout backfill-checkpoints branch
        uses: actions/checkout@v4
        with:
          ref: backfill-checkpoints
          path: checkpoints-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r main/requirements.txt

      - name: Restore checkpoint data into working copy
        run: |
          mkdir -p main/checkpoints
          cp -r checkpoints-branch/checkpoints/. main/checkpoints/

      - name: Update OHLC (incremental + rotated full refresh)
        working-directory: main
        run: python scripts/update_ohlc.py --status-out pipeline_status.json

      - name: Commit checkpoint updates to backfill-checkpoints branch
        run: |
          rm -rf checkpoints-branch/checkpoints
          mkdir -p checkpoints-branch/checkpoints
          cp -r main/checkpoints/. checkpoints-branch/checkpoints/
          cd checkpoints-branch
          git config user.name "daily-update-bot"
          git config user.email "actions@github.com"
          git add checkpoints
          if git diff --cached --quiet; then
            echo "No checkpoint changes to commit"
          else
            git commit -m "Daily OHLC update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin backfill-checkpoints
          fi

      - name: Rebuild market snapshot
        working-directory: main
        run: python scripts/market_snapshot.py --out market_snapshot.json

      - name: Rebuild market screens (F&O + full universe)
        working-directory: main
        run: |
          python scripts/market_screens.py --universe fno --out market_screens.json
          python scripts/market_screens.py --universe full --out market_screens_full.json

      - name: Rebuild strangle breakeven screen
        working-directory: main
        run: python scripts/strangle_screen.py --out strangle_screen.json --threshold 10

      - name: Rebuild Supertrend (F&O + full universe)
        working-directory: main
        run: |
          python scripts/supertrend.py --universe fno --out supertrend.json
          python scripts/supertrend.py --universe full --out supertrend_full.json

      - name: Commit regenerated JSON to main
        working-directory: main
        run: |
          git config user.name "daily-update-bot"
          git config user.email "actions@github.com"
          git add market_snapshot.json market_screens.json market_screens_full.json strangle_screen.json supertrend.json supertrend_full.json pipeline_status.json
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
