name: Build Earnings Calendar

# Manually triggered via GitHub's own "Run workflow" button. Fetches NSE's
# upcoming board-meeting intimations (companies about to declare quarterly
# results) for the universe, next N days. First real run is also the
# feasibility test for NSE's API from a GitHub Actions runner — could not
# be verified from the sandboxed dev environment that wrote this (proxy
# blocked it outright), so this run's outcome is the real signal.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookahead window in days"
        required: false
        default: "7"

permissions:
  contents: write   # needed to commit earnings_calendar.json back to main

jobs:
  earnings_calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch earnings calendar
        run: python scripts/earnings_calendar.py --out earnings_calendar.json --days "${{ github.event.inputs.days }}"

      - name: Commit calendar
        run: |
          git config user.name "earnings-bot"
          git config user.email "actions@github.com"
          git add earnings_calendar.json
          if git diff --cached --quiet; then
            echo "No calendar changes to commit"
          else
            git commit -m "Earnings calendar: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
